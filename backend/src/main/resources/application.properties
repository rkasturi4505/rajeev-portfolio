spring.application.name=backend

# =========================================================
# MySQL Configuration
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.web.resources.static-locations=classpath:/static/
spring.jpa.open-in-view=false

# =========================================================
# Gmail SMTP Configuration
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# Portfolio Admin Configuration
# =========================================================

portfolio.admin.username=${ADMIN_USERNAME}
portfolio.admin.email=${ADMIN_EMAIL}
portfolio.admin.password=${ADMIN_PASSWORD}
portfolio.admin.role=ADMIN

# =========================================================
# JWT Configuration
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# Logging
# =========================================================

logging.level.org.springframework.security=INFO

server.servlet.context-path=